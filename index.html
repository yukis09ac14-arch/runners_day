<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>NG日の登録</title>
    <style>
      :root {
        --bg: #f6f7f5;
        --card: #ffffff;
        --ink: #1e2420;
        --muted: #6b736d;
        --line: #e2e5e1;
        --run: #06c755;
        --ng: #d9473b;
        --ng-bg: #fdecea;
        --sat: #2f6fd0;
        --sun: #d9473b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141715;
          --card: #1d211e;
          --ink: #eef1ee;
          --muted: #9aa39c;
          --line: #2c322e;
          --ng-bg: #3a1f1c;
          --sat: #7aa7ec;
          --sun: #f08077;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP',
          system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
        padding: 16px max(16px, env(safe-area-inset-right))
          calc(96px + env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
      }
      h1 {
        font-size: 18px;
        margin: 4px 0 4px;
      }
      .lead {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        margin: 0 0 16px;
      }
      .month {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .month h2 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
      }
      .dow {
        font-size: 11px;
        text-align: center;
        color: var(--muted);
        padding: 2px 0;
      }
      .dow.sat {
        color: var(--sat);
      }
      .dow.sun {
        color: var(--sun);
      }
      .day {
        aspect-ratio: 1;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        opacity: 0.45;
      }
      .day.open {
        opacity: 1;
        color: var(--ink);
        background: var(--bg);
        cursor: pointer;
        font-weight: 600;
      }
      .day.open.sat {
        color: var(--sat);
      }
      .day.open.sun {
        color: var(--sun);
      }
      .day.ng {
        background: var(--ng-bg);
        color: var(--ng);
        outline: 2px solid var(--ng);
      }
      .day small {
        font-size: 9px;
        font-weight: 700;
        line-height: 1;
      }
      .day:focus-visible {
        outline: 2px solid var(--run);
      }
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--card);
        border-top: 1px solid var(--line);
        padding: 12px max(16px, env(safe-area-inset-right))
          calc(12px + env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .bar span {
        flex: 1;
        font-size: 13px;
        color: var(--muted);
      }
      .save {
        border: 0;
        border-radius: 24px;
        background: var(--run);
        color: #fff;
        font: inherit;
        font-weight: 700;
        font-size: 15px;
        padding: 12px 28px;
      }
      .save:disabled {
        opacity: 0.5;
      }
      .msg {
        padding: 24px 0;
        color: var(--muted);
        text-align: center;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <h1>都合の悪い日（NG日）</h1>
    <p class="lead" id="lead">読み込んでいます…</p>
    <div id="cal"></div>
    <div class="bar" id="bar" hidden>
      <span id="count"></span>
      <button class="save" id="save" disabled>保存する</button>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
      // ===== ここを自分の値に書き換える =====
      const LIFF_ID = '2012467857-YUxfc11l';
      const API_URL =
        'https://script.google.com/macros/s/AKfycbxX49GfyGEqGVTgkYDl2pK-38lYonfGzf7JNDlkUVVuB63DxRLsplthiPhz1CoBA4DU/exec';
      // =====================================

      const $ = (id) => document.getElementById(id);
      const WD = ['日', '月', '火', '水', '木', '金', '土'];
      let ng = new Set(),
        saved = '',
        holidays = new Set(),
        range = null;

      function key(d) {
        return (
          d.getFullYear() +
          '-' +
          String(d.getMonth() + 1).padStart(2, '0') +
          '-' +
          String(d.getDate()).padStart(2, '0')
        );
      }
      function parse(k) {
        const [y, m, d] = k.split('-').map(Number);
        return new Date(y, m - 1, d);
      }

      async function call(action, extra) {
        // text/plain で送るとプリフライトが発生せず、Apps Script に直接届く
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action,
            idToken: liff.getIDToken(),
            ...extra,
          }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '通信に失敗しました');
        return data;
      }

      function render() {
        const cal = $('cal');
        cal.innerHTML = '';
        const from = parse(range.from),
          to = parse(range.to);
        for (
          let m = new Date(from.getFullYear(), from.getMonth(), 1);
          m <= to;
          m = new Date(m.getFullYear(), m.getMonth() + 1, 1)
        ) {
          const box = document.createElement('section');
          box.className = 'month';
          box.innerHTML = `<h2>${m.getFullYear()}年${m.getMonth() + 1}月</h2>`;
          const grid = document.createElement('div');
          grid.className = 'grid';
          WD.forEach((w, i) => {
            const e = document.createElement('div');
            e.className = 'dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
            e.textContent = w;
            grid.append(e);
          });
          for (let i = 0; i < m.getDay(); i++)
            grid.append(document.createElement('div'));
          const last = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
          for (let d = 1; d <= last; d++) {
            const day = new Date(m.getFullYear(), m.getMonth(), d),
              k = key(day);
            const b = document.createElement('button');
            b.className = 'day';
            b.type = 'button';
            const hol = holidays.has(k),
              dow = day.getDay();
            const open =
              k >= range.from &&
              k <= range.to &&
              (dow === 0 || dow === 6 || hol);
            if (dow === 0 || hol) b.classList.add('sun');
            else if (dow === 6) b.classList.add('sat');
            b.innerHTML = `${d}${hol ? '<small>祝</small>' : ''}`;
            if (open) {
              b.classList.add('open');
              if (ng.has(k)) {
                b.classList.add('ng');
                b.innerHTML = `${d}<small>NG</small>`;
              }
              b.setAttribute('aria-pressed', ng.has(k));
              b.setAttribute(
                'aria-label',
                `${m.getMonth() + 1}月${d}日 ${ng.has(k) ? 'NG' : '参加できる'}`,
              );
              b.onclick = () => {
                ng.has(k) ? ng.delete(k) : ng.add(k);
                render();
              };
            } else b.disabled = true;
            grid.append(b);
          }
          box.append(grid);
          cal.append(box);
        }
        const changed = [...ng].sort().join(',') !== saved;
        $('count').textContent =
          `NG日 ${ng.size}日` + (changed ? '（未保存）' : '');
        $('save').disabled = !changed;
      }

      $('save').onclick = async () => {
        $('save').disabled = true;
        $('save').textContent = '保存中…';
        try {
          await call('setMyNg', { dates: [...ng] });
          saved = [...ng].sort().join(',');
          $('save').textContent = '保存しました';
          setTimeout(() => {
            $('save').textContent = '保存する';
            render();
          }, 1500);
        } catch (e) {
          alertMsg(e.message);
          $('save').textContent = '保存する';
          render();
        }
      };

      function alertMsg(t) {
        $('lead').textContent = t;
      }

      (async () => {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          const data = await call('getMyNg');
          range = { from: data.from, to: data.to };
          holidays = new Set(data.holidays);
          ng = new Set(data.dates);
          saved = [...ng].sort().join(',');
          $('lead').textContent =
            `${data.name || ''}さんのNG日です。練習会のある土日祝だけ選べます。ここで登録した日はあなたにしか見えません。幹事にも、誰のNG日かは分かりません。`;
          $('bar').hidden = false;
          render();
        } catch (e) {
          const p = document.createElement('p');
          p.className = 'msg';
          p.textContent = e.message + '　LINEのトークから開き直してください。';
          $('cal').replaceChildren(p);
          $('lead').textContent = '';
        }
      })();
    </script>
  </body>
</html>
